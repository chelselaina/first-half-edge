name: First Half Edge Research Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10,13,15,17,19 * * *'
      timezone: 'America/New_York'

permissions:
  contents: read
  issues: write

concurrency:
  group: first-half-edge-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check upcoming games and fresh 1H lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_OUTPUT: run_artifacts/quotes.csv
        run: python -m agent.auto_alert
      - name: Save paper research log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-half-scan-${{ github.run_id }}
          path: run_artifacts/quotes.csv
          if-no-files-found: warn
          retention-days: 30
