name: First Half Edge Research Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10,13,15,17,19 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write  # save a forward-only paper research ledger
  issues: write    # existing public research-only Issue alerts

concurrency:
  group: first-half-edge-research
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify paper ledger logic (no API credits)
        run: python -m agent.performance --self-test

      # IMPORTANT: capture forecasts before the sportsbook scanner.
      # No sportsbook odds are required to freeze an eligible pre-tip prediction.
      - name: Freeze pregame predictions and grade completed games
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m agent.performance

      - name: Check upcoming games and fresh first-half lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCAN_OUTPUT: run_artifacts/quotes.csv
        run: python -m agent.auto_alert

      # Persist any first-half quotes captured by the odds scanner.
      # Run even if the odds call failed: frozen predictions still matter.
      - name: Attach paper price-gap watches
        if: always()
        env:
          SCAN_OUTPUT: run_artifacts/quotes.csv
        run: python -m agent.performance --quotes-only

      - name: Preserve paper ledgers
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/paper_predictions.csv data/paper_watch_candidates.csv; do
            if test -f "$file"; then
              git add "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Save pregame paper forecasts and grades [skip ci]"
            git push origin HEAD:main
          else
            echo "No new paper records to save."
          fi

      - name: Preserve troubleshooting artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-half-scan-${{ github.run_id }}
          path: |
            run_artifacts/quotes.csv
            data/paper_predictions.csv
            data/paper_watch_candidates.csv
          if-no-files-found: warn
          retention-days: 30
